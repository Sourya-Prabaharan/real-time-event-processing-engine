global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "streamflow-api"
    static_configs:
      - targets: ["api:8080", "host.docker.internal:8080"]
        labels:
          service: "streamflow-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
