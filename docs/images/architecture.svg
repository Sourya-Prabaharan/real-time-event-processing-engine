<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8; }
      .card-accent { fill: #111827; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .card-db { fill: #111827; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .card-dlq { fill: #111827; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
      .text-title { fill: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .text-sub { fill: #9ca3af; font-family: ui-monospace, monospace; font-size: 11px; }
      .line { stroke: #4b5563; stroke-width: 1.5; marker-end: url(#arrow); }
      .line-accent { stroke: #3b82f6; stroke-width: 2; marker-end: url(#arrow-blue); }
      .line-dlq { stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4; marker-end: url(#arrow-red); }
      .badge-label { fill: #60a5fa; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b7280" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Component 1: Event Producer -->
  <g transform="translate(30, 160)">
    <rect width="160" height="90" class="card"/>
    <text x="20" y="35" class="text-title">Event Generator</text>
    <text x="20" y="55" class="text-sub">Weighted RNG</text>
    <text x="20" y="72" class="text-sub">cmd/producer</text>
  </g>

  <!-- Connection: Producer to Kafka -->
  <path d="M 190 205 L 255 205" class="line-accent"/>
  <text x="195" y="195" class="badge-label">key: product_id</text>

  <!-- Component 2: Apache Kafka -->
  <g transform="translate(260, 140)">
    <rect width="170" height="130" class="card-accent"/>
    <text x="20" y="35" class="text-title">Apache Kafka</text>
    <text x="20" y="58" class="text-sub">Topic: events</text>
    <text x="20" y="78" class="text-sub">6 Partitions</text>
    <text x="20" y="98" class="text-sub">Order per product_id</text>
  </g>

  <!-- Connection: Kafka to Worker Pool -->
  <path d="M 430 205 L 495 205" class="line-accent"/>
  <text x="435" y="195" class="badge-label">partition % N</text>

  <!-- Component 3: Go Worker Pool -->
  <g transform="translate(500, 130)">
    <rect width="170" height="150" class="card"/>
    <text x="18" y="32" class="text-title">Go Worker Pool</text>
    <text x="18" y="52" class="text-sub">Bounded Concurrency</text>
    <text x="18" y="72" class="text-sub">Channel Backpressure</text>
    <text x="18" y="92" class="text-sub">In-order Offset Commits</text>
    <text x="18" y="112" class="text-sub">Jittered Retries</text>
  </g>

  <!-- Connection: Worker to PostgreSQL -->
  <path d="M 670 180 L 735 125" class="line"/>
  <text x="680" y="145" class="badge-label" fill="#10b981">idempotent</text>

  <!-- Component 4: PostgreSQL -->
  <g transform="translate(740, 75)">
    <rect width="150" height="95" class="card-db"/>
    <text x="16" y="30" class="text-title">PostgreSQL 16</text>
    <text x="16" y="50" class="text-sub">Durable Source of Truth</text>
    <text x="16" y="68" class="text-sub">UUID PK Constraint</text>
    <text x="16" y="84" class="text-sub">ON CONFLICT SKIP</text>
  </g>

  <!-- Connection: Worker to Redis -->
  <path d="M 670 205 L 735 205" class="line"/>
  <text x="680" y="198" class="badge-label">pipelined</text>

  <!-- Component 5: Redis -->
  <g transform="translate(740, 180)">
    <rect width="150" height="85" class="card"/>
    <text x="16" y="28" class="text-title">Redis 7</text>
    <text x="16" y="48" class="text-sub">Real-Time Cache</text>
    <text x="16" y="64" class="text-sub">TTL Expirations</text>
  </g>

  <!-- Connection: Worker to DLQ -->
  <path d="M 670 235 L 735 295" class="line-dlq"/>
  <text x="675" y="280" class="badge-label" fill="#ef4444">failures</text>

  <!-- Component 6: Dead-Letter Queue -->
  <g transform="translate(740, 275)">
    <rect width="150" height="85" class="card-dlq"/>
    <text x="16" y="28" class="text-title">Dead-Letter DLQ</text>
    <text x="16" y="48" class="text-sub">dead_letter_events</text>
    <text x="16" y="64" class="text-sub">Kafka events-dlq</text>
  </g>

  <!-- Bottom: Observability Bar -->
  <g transform="translate(30, 390)">
    <rect width="860" height="50" class="card" stroke="#334155"/>
    <text x="24" y="30" class="text-title">Observability Layer:</text>
    <text x="170" y="30" class="text-sub">Prometheus (/metrics) Scrapes &amp; Histograms</text>
    <text x="510" y="30" class="text-sub">Grafana Dashboards (:3000)</text>
    <text x="710" y="30" class="text-sub">Web Console (:8080)</text>
  </g>
</svg>
